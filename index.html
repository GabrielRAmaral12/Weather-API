<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/bf46110e2a.js" crossorigin="anonymous"></script>
    <title>Previsão do Tempo</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="search">
                <input type="search" placeholder="Digite o nome da cidade" id="input-city">
                <button class="btn-search" onclick="clickSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="info">
                <h2 class="city"></h2>
                <p class="temp"></p>
            </div>
            <div class="img-icon">
                <img src="https://openweathermap.org/img/wn/04n.png" class="img" alt="icone-tempo">
                <p class="time-info"></p>
            </div>
            <div class="humidity">
                <p class="humidity-info"></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
